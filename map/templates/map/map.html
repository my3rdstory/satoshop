{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맵 스페이스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'map/css/map.css' %}">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
  </style>
  <script>
    (function() {
      let theme = 'light';
      try {
        const stored = localStorage.getItem('theme');
        if (stored) {
          theme = stored;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e2) {
          theme = 'light';
        }
      }

      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.add('light');
      }
    })();
  </script>
</head>
<body class="map-mode">
  <div class="map-root" id="mapRoot">
    <div class="map-viewport" id="mapViewport">
      <div class="map-world" id="mapWorld" data-width="1800" data-height="1000" role="application" aria-label="맵 공간">
        <div class="map-backdrop" style="background-image: url('{% static 'map/images/map-bg.svg' %}');"></div>
        <div class="map-layer map-zones" id="mapZones" aria-hidden="true"></div>
        <div class="map-player" id="mapPlayer" role="img" aria-label="플레이어 캐릭터"></div>
      </div>
    </div>

    <div class="map-hud map-hud-left">
      <div class="map-panel-card">
        <span class="map-eyebrow">MAP SPACE</span>
        <h1 class="map-hud-title">인터랙티브 맵</h1>
        <p class="map-panel-muted">화살표로 이동하고 링크 존에서 상호작용하세요.</p>
      </div>
      <div class="map-panel-card">
        <h2 class="map-panel-title">현재 캐릭터</h2>
        <p class="map-panel-value" id="playerName">탐험자</p>
        <p class="map-panel-muted">좌표: <span id="playerPosition">0, 0</span></p>
      </div>
    </div>

    <div class="map-hud map-hud-right">
      <div class="map-panel-card">
        <h2 class="map-panel-title">인터랙티브 존</h2>
        <p class="map-panel-muted" id="zoneStatus">아직 발견된 존이 없습니다.</p>
        <div class="map-zone-actions is-hidden" id="zoneActions"></div>
      </div>
      <div class="map-panel-card">
        <h2 class="map-panel-title">조작 안내</h2>
        <ul class="map-list">
          <li>화살표 키로 상하좌우 이동합니다.</li>
          <li>링크 존에 들어가면 우측 패널에 버튼이 나타납니다.</li>
          <li>모달은 ESC 또는 닫기 버튼으로 종료합니다.</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="map-modal is-hidden" id="mapModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="map-modal-card">
      <div class="map-modal-header">
        <h3 class="map-modal-title" id="mapModalTitle">링크 보기</h3>
        <button type="button" class="map-modal-close" id="mapModalClose">닫기</button>
      </div>
      <iframe class="map-modal-frame" id="mapModalFrame" title="링크 미리보기" src="about:blank"></iframe>
    </div>
  </div>

  <script src="{% static 'map/js/map.js' %}"></script>
</body>
</html>
