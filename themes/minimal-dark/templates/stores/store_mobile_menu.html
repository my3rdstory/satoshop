{% load static %}

<div id="store-mobile-menu" class="minimal-mobile-menu" aria-label="스토어 모바일 메뉴">
  <ul class="minimal-mobile-menu__list">
    <li class="minimal-mobile-menu__item">
      <a class="minimal-mobile-menu__link" href="{% url 'stores:store_detail' store_id=store.store_id %}">스토어 홈</a>
    </li>
    <li class="minimal-mobile-menu__item">
      <a class="minimal-mobile-menu__link" href="{% url 'products:public_product_list' store.store_id %}">상품</a>
    </li>
    <li class="minimal-mobile-menu__item">
      <a class="minimal-mobile-menu__link" href="{% url 'meetup:meetup_list' store.store_id %}">밋업</a>
    </li>
    <li class="minimal-mobile-menu__item">
      <a class="minimal-mobile-menu__link" href="{% url 'lecture:live_lecture_list' store.store_id %}">라이브 강의</a>
    </li>
    <li class="minimal-mobile-menu__item">
      <a class="minimal-mobile-menu__link" href="{% url 'file:file_list' store.store_id %}">파일</a>
    </li>
  </ul>

  <div class="minimal-mobile-menu__section">
    <p class="minimal-mobile-menu__title">관리 메뉴</p>
    {% if user.is_authenticated and user == store.owner %}
      <a class="minimal-mobile-menu__link" href="{% url 'stores:my_stores' %}">관리 허브로 이동</a>
    {% endif %}
  </div>
</div>
